name: 'Daily Reminder — Apex 50K v2.6 (21:00 HKT / 13:00 UTC)'

# ONCE per day, weekdays only, at 21:00 HKT = 13:00 UTC
# = 09:00 EDT (summer) / 08:00 EST (winter) = US market open
# 21:00 HKT chosen so reminder arrives at T+0 of US session

on:
  schedule:
    # 13:00 UTC = 21:00 HKT = 09:00 EDT
    # Mon-Fri only (markets closed weekends)
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GIT_USER_NAME: 'Apex 皮盤房 bot'
      GIT_USER_EMAIL: 'bot@apex.local'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: AUTOMATION/requirements.txt

      - name: Install deps
        working-directory: AUTOMATION
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Configure git for auto-push
        run: |
          git config --global user.name 'Apex 皮盤房 bot'
          git config --global user.email 'bot@apex.local'
          # Use GHA's auto-issued token for HTTPS push
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/yip-lgtm/apex-bootcamp.git"
          echo "✓ git remote configured"

      - name: Send daily reminder + auto git push
        working-directory: AUTOMATION
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_APEX_PAT }}
        run: |
          # Skip if today's artifact already exists (avoid double-send from 3 cron slots)
          today=$(date -u +%Y-%m-%d)
          if [ -f "reports/daily/${today}/reminder-${today}.md" ]; then
            echo "⏭️  Today's reminder (${today}) already exists, skipping"
            exit 0
          fi
          .venv/bin/python src/daily_reminder.py
          echo "✅ daily reminder sent + artifacts pushed"
