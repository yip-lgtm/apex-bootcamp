name: 'Daily Reminder — Apex 50K v2.6 (20:30 HKT / 12:30 UTC)'

# Weekdays only, 30 min before US market open
# HKT 20:30 = 12:30 UTC = 08:30 ET (summer) / 07:30 ET (winter)

on:
  schedule:
    # 12:30 UTC = 20:30 HKT = 08:30 EDT (summer) / 07:30 EST (winter)
    # Run only weekdays (Mon-Fri)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      GIT_USER_NAME: 'Apex 皮盤房 bot'
      GIT_USER_EMAIL: 'bot@apex.local'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: AUTOMATION/requirements.txt

      - name: Install deps
        working-directory: AUTOMATION
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Configure git for auto-push
        run: |
          git config --global user.name 'Apex 皮盤房 bot'
          git config --global user.email 'bot@apex.local'
          # Use GHA's auto-issued token for HTTPS push
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/yip-lgtm/apex-bootcamp.git"
          echo "✓ git remote configured"

      - name: Send daily reminder + auto git push
        working-directory: AUTOMATION
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_APEX_PAT }}
        run: |
          .venv/bin/python src/daily_reminder.py
          echo "✅ daily reminder sent + artifacts pushed"
