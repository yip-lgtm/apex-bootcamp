name: 'Daily Scan — Apex 50K v2.6 (GitHub Actions cron, no Mavis agent)'

# Fallback for when Mavis cron fails (e.g. quota issues).
# Runs at 13:00 UTC = 21:00 Asia/Shanghai = 09:00 EDT (summer) / 08:00 EST (winter).
# This duplicates what cron_runner.sh does, but on GitHub's infra.

on:
  schedule:
    # Two daily fires to reduce GHA schedule-trigger delay impact:
    # - 09:00 UTC = 17:00 SHA = 05:00 EDT (early)
    # - 13:00 UTC = 21:00 SHA = 09:00 EDT (target apex killzone 9-11 EST)
    - cron: '0 9,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # Allow for slow LLM calls (MGC/MNQ can take 8-10 min in cold env)
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
      APEX_SCAN_OUT_DIR: ${{ github.workspace }}/AUTOMATION/reports
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: AUTOMATION/requirements.txt

      - name: Install deps
        working-directory: AUTOMATION
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      - name: Write .env (literal values)
        working-directory: AUTOMATION
        run: |
          cat > .env << EOF
          MINIMAX_API_KEY=${MINIMAX_API_KEY}
          TRADINGAGENTS_LLM_PROVIDER=minimax
          TRADINGAGENTS_DEEP_THINK_LLM=MiniMax-M3
          TRADINGAGENTS_QUICK_THINK_LLM=MiniMax-M2.7-highspeed
          TRADINGAGENTS_OUTPUT_LANGUAGE=繁體中文
          TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
          TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
          EOF
          echo ".env written (length: $(wc -c < .env))"

      - name: Run daily scan (15 min max)
        working-directory: AUTOMATION
        timeout-minutes: 15
        env:
          APEX_SCAN_OUT_DIR: ${{ github.workspace }}/AUTOMATION/reports
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          echo "Today ET: $TODAY_ET"
          .venv/bin/python -u src/apex_scan.py "$TODAY_ET" 2>&1 | tee /tmp/scan.log
          # Scanner now saves to $APEX_SCAN_OUT_DIR (set above to AUTOMATION/reports)
          ls -la reports/ 2>&1 | head -5

      - name: Run forward test (10 min max)
        working-directory: AUTOMATION
        timeout-minutes: 10
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          .venv/bin/python -u src/apex_forward.py --mode=combined "$TODAY_ET" 2>&1 | tail -20 || \
            echo "forward test failed (non-fatal)"
          mkdir -p reports
          cp /workspace/reports/apex-forward-log.jsonl reports/ 2>/dev/null || \
            echo "no /workspace path, skipping copy"

      - name: Send Telegram summary
        if: always()
        run: |
          TODAY_ET=$(TZ=America/New_York date +%Y-%m-%d)
          NOW_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          if [ -f "AUTOMATION/reports/apex-scan-${TODAY_ET}.md" ]; then
            # Count A/B grade actionables from the report
            ACTIONABLES=$(grep -cE '^\| [A-Z]+=F \| \*\*[AB]\*\*' "AUTOMATION/reports/apex-scan-${TODAY_ET}.md" 2>/dev/null || echo 0)
            # Extract ticker + grade pairs
            TICKERS=$(grep -oE '^\| [A-Z]+=F \| \*\*[AB]\*\*' "AUTOMATION/reports/apex-scan-${TODAY_ET}.md" | awk '{print $2, $4}' | tr '\n' ',' | sed 's/,$//')
          else
            ACTIONABLES="?"
            TICKERS=""
          fi
          # Read forward log if present
          if [ -f "AUTOMATION/reports/apex-forward-log.jsonl" ]; then
            CUM=$(python3 AUTOMATION/src/summarize_log.py "AUTOMATION/reports/apex-forward-log.jsonl" 2>/dev/null || echo "?")
          else
            CUM="?"
          fi
          SUMMARY="A 皮盤房 v2.6 daily scan (GHA) | ${TODAY_ET} ET | ${NOW_UTC} | A:${ACTIONABLES}${TICKERS:+ (${TICKERS})} | Cum:${CUM} | ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          # Build JSON payload safely
          python3 -c 'import json,sys; print(json.dumps({"chat_id": sys.argv[1], "text": sys.argv[2]}))' "$TELEGRAM_CHAT_ID" "$SUMMARY" > /tmp/tg_payload.json
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d @/tmp/tg_payload.json
          echo "Telegram push complete"

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-scan-${{ env.TODAY_ET }}
          path: AUTOMATION/reports/
          retention-days: 30
