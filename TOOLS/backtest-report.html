<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex Backtest 報告 v1.1</title>
  <style>
    :root {
      --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a; --text: #e6e8ec;
      --muted: #9aa3b2; --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      padding: 20px; max-width: 920px; margin: 0 auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 6px; }
    .ver{display:inline-block;background:#3b1f1f;color:#fca5a5;font-size:0.75rem;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
    .sub { color: var(--muted); margin-bottom: 18px; font-size: 0.86rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    }
    .card h2 {
      font-size: 0.98rem; margin-bottom: 12px; color: var(--accent);
      border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
    .row label.title { min-width: 160px; font-size: 0.86rem; color: var(--muted); }
    .options { display: flex; flex-wrap: wrap; gap: 6px; }
    .options label {
      display: flex; align-items: center; gap: 4px; background: #252a33;
      padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.84rem;
      border: 1px solid transparent;
    }
    .options label:hover { border-color: var(--accent); }
    .options input { accent-color: var(--accent); }
    input, textarea, select {
      background: #252a33; border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 8px; font-size: 0.86rem; width: 100%; max-width: 100%;
    }
    textarea { min-height: 64px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .row label.title { min-width: 100%; }
    }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
    button {
      background: var(--accent); color: white; border: none; padding: 9px 16px;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    button.secondary { background: #334155; }
    #report {
      background: #111827; border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace;
      font-size: 0.8rem; line-height: 1.5; min-height: 100px;
    }
    .hint { font-size: 0.78rem; color: var(--muted); margin: 4px 0 10px; }
    .live { font-size: 0.78rem; color: #86efac; margin: 4px 0 10px; }
    .auto { color: #86efac; }
    .chk-block {
      background: #1e2530; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    }
    .chk-block .name { font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #93c5fd; }
  </style>
</head>
<body>
  <h1>Apex Backtest 報告 <span class="ver">Backtest</span></h1>
  <p class="sub">記錄回測結果｜左右環境｜TradingView 連結｜LLM Remark</p>

  <div class="card">
    <h2>回測設定</h2>
    <div class="grid3">
      <div class="row"><label class="title">回測日期</label><input type="date" id="date" /></div>
      <div class="row">
        <label class="title">品種</label>
        <select id="symbol">
          <option>MNQ</option><option>MES</option><option>MYM</option><option>M2K</option>
          <option>MGC</option><option>SIL</option><option>MCL</option>
          <option>MBT</option><option>MET</option><option>其他</option>
        </select>
      </div>
      <div class="row">
        <label class="title">週期</label>
        <select id="timeframe">
          <option>5m</option><option>15m</option><option>1H</option><option>4H</option><option>D</option><option>混合</option>
        </select>
      </div>
    </div>
    <div class="grid2">
      <div class="row"><label class="title">回測區間起</label><input type="date" id="rangeStart" /></div>
      <div class="row"><label class="title">回測區間迄</label><input type="date" id="rangeEnd" /></div>
    </div>
    <div class="row">
      <label class="title">腳本/策略名</label>
      <input type="text" id="scriptName" placeholder="例如：MNQ 套杀優化版" />
    </div>
  </div>

  <div class="card">
    <h2>環境（左右 = 策略邏輯）</h2>
    <div class="row">
      <label class="title">左側環境</label>
      <select id="leftEnv">
        <option value="">—</option>
        <option>普通(打牌逻辑)</option><option>AMD</option><option>SMT</option><option>跳水</option><option>MMXM</option><option>無</option>
      </select>
    </div>
    <div class="row">
      <label class="title">右側環境</label>
      <select id="rightEnv">
        <option value="">—</option>
        <option>三驱动</option><option>NDOG</option><option>SMT</option><option>NWOG</option><option>普通(打牌逻辑)</option><option>套杀</option><option>無</option>
      </select>
    </div>
    <div class="row"><label class="title">主動</label><div class="options"><label><input type="radio" name="active" value="Yes"> Yes</label><label><input type="radio" name="active" value="No"> No</label></div></div>
    <div class="row"><label class="title">被動</label><div class="options"><label><input type="radio" name="passive" value="Yes"> Yes</label><label><input type="radio" name="passive" value="No"> No</label></div></div>
    <div class="row"><label class="title">工程</label><div class="options"><label><input type="radio" name="engineering" value="Yes"> Yes</label><label><input type="radio" name="engineering" value="No"> No</label></div></div>
    <div class="row"><label class="title">預設</label><div class="options"><label><input type="radio" name="preset" value="Yes"> Yes</label><label><input type="radio" name="preset" value="No"> No</label></div></div>
    <div class="row"><label class="title">邏輯等級</label><div class="options"><label><input type="radio" name="grade" value="A"> A</label><label><input type="radio" name="grade" value="B"> B</label><label><input type="radio" name="grade" value="C"> C</label></div></div>
  </div>

  <div class="card">
    <h2>回測結果（策略測試器）</h2>
    <p class="hint">預設每筆風險 <span class="auto">$100</span>。填「淨利 + 交易數 + 盈利數」即可自動算出 WR、RR、PF、均盈。</p>
    <div class="grid2">
      <div class="row"><label class="title">淨利潤 ($)</label><input type="number" id="netProfit" step="0.01" oninput="recalc()" placeholder="0.00" /></div>
      <div class="row"><label class="title">最大回撤 ($)</label><input type="number" id="maxDD" step="0.01" oninput="recalc()" placeholder="0.00" /></div>
      <div class="row"><label class="title">總交易數</label><input type="number" id="trades" min="0" oninput="recalc()" placeholder="0" /></div>
      <div class="row"><label class="title">盈利筆數 <span class="auto" style="cursor:pointer;text-decoration:underline" onclick="computeWins()" title="從 交易數 × 勝率 自動填入">↻ 從勝率</span></label><input type="number" id="wins" min="0" oninput="recalc()" placeholder="0" /></div>
    </div>
    <div class="grid2">
      <div class="row"><label class="title">單筆風險 $（預設100）</label><input type="number" id="riskPerTrade" step="1" value="100" oninput="recalc()" /></div>
      <div class="row"><label class="title">勝率 % <span class="auto">（自動，可手動覆蓋）</span></label><input type="number" id="winRate" step="0.1" oninput="wrManual=this.value!==''" placeholder="0.0" /></div>
    </div>
    <div class="grid2">
      <div class="row"><label class="title">風險報酬比 RR <span class="auto">（自動，可手動覆蓋）</span></label><input type="number" id="rr" step="0.1" oninput="rrManual=this.value!==''" placeholder="例如 2.2" /></div>
      <div class="row"><label class="title">盈利因子 PF <span class="auto">（自動，可手動覆蓋）</span></label><input type="number" id="profitFactor" step="0.01" oninput="pfManual=this.value!==''" placeholder="0.00" /></div>
    </div>
    <div class="grid2">
      <div class="row"><label class="title">單筆止損點數</label><input type="number" id="slPoints" step="0.1" placeholder="例如 22" /></div>
      <div class="row"><label class="title">推算均盈 $（自動）</label><input type="number" id="avgWin" step="0.01" readonly placeholder="0.00" /></div>
    </div>
    <p class="live" id="livePreview">填淨利 / 交易數 / 盈利數 → 自動算 WR、RR、PF</p>
  </div>

  <div class="card">
    <h2>TradingView 連結</h2>
    <p class="hint">貼策略測試器截圖 Snapshot 或圖表分享連結。</p>
    <div class="chk-block">
      <div class="name">策略測試器結果圖</div>
      <input type="url" id="linkResult" placeholder="https://www.tradingview.com/x/..." />
    </div>
    <div class="chk-block">
      <div class="name">圖表 / 訊號範例</div>
      <input type="url" id="linkChart" placeholder="https://www.tradingview.com/x/..." />
    </div>
    <div class="chk-block">
      <div class="name">額外連結</div>
      <input type="url" id="linkExtra" placeholder="可留空" />
    </div>
  </div>

  <div class="card">
    <h2>LLM / 結論</h2>
    <div class="row"><label class="title">LLM 判斷</label><div class="options"><label><input type="radio" name="llm" value="A"> A</label><label><input type="radio" name="llm" value="B"> B</label><label><input type="radio" name="llm" value="C"> C</label><label><input type="radio" name="llm" value="未使用"> 未使用</label></div></div>
    <div class="row" style="align-items:flex-start">
      <label class="title">LLM Remark</label>
      <textarea id="llmRemark" placeholder="優化建議、參數結論、是否值得實盤..."></textarea>
    </div>
    <div class="row" style="align-items:flex-start">
      <label class="title">備註</label>
      <textarea id="notes" placeholder="掃單深度、Killzone、已知問題..."></textarea>
    </div>
  </div>

  <div class="btns">
    <button onclick="generateReport()">產生報告</button>
    <button class="secondary" onclick="copyReport()">複製報告</button>
    <button class="secondary" onclick="copyJSON()">複製 JSON</button>
    <button class="secondary" onclick="resetForm()">清空</button>
  </div>

  <div class="card">
    <h2>產生的報告</h2>
    <div id="report">填寫後點「產生報告」</div>
  </div>

  <script>
    let wrManual=false, pfManual=false, rrManual=false;
    document.getElementById('date').valueAsDate = new Date();
    function val(name) {
      const el = document.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : '—';
    }
    function id(i) { return document.getElementById(i).value || '—'; }
    function link(i) {
      const v = document.getElementById(i).value.trim();
      return v || '—';
    }
    function countYes() {
      let n = 0;
      ['active','passive','engineering','preset'].forEach(k => { if (val(k) === 'Yes') n++; });
      return n;
    }
    function calcFromFixedRisk(netProfit, trades, wins, risk){
      const t=Number(trades)||0, w=Number(wins)||0, np=Number(netProfit);
      const r=Number(risk)>0?Number(risk):100;
      const losses=Math.max(0, t-w);
      const wr=t>0?(w/t*100):0;
      let avgWin=null, rr=null, pf=null;
      if(w>0 && !isNaN(np)){
        avgWin=(np + losses*r) / w;
        if(avgWin>0){
          rr=avgWin / r;
          pf=losses>0?(w*avgWin)/(losses*r):999;
        }
      } else if(w===0 && t>0 && !isNaN(np)){
        avgWin=0; rr=0; pf=0;
      }
      return {wr, avgWin, avgLoss:r, rr, pf, losses, risk:r};
    }
    function recalc(){
      const np=document.getElementById('netProfit').value;
      const trades=document.getElementById('trades').value;
      const wins=document.getElementById('wins').value;
      const risk=document.getElementById('riskPerTrade').value || 100;
      const d=calcFromFixedRisk(np, trades, wins, risk);
      if(!wrManual){
        document.getElementById('winRate').value=d.wr?d.wr.toFixed(1):'';
      }
      if(!rrManual){
        document.getElementById('rr').value=d.rr!=null?d.rr.toFixed(2):'';
      }
      if(!pfManual){
        document.getElementById('profitFactor').value=d.pf==null?'':(d.pf>=999?'999':d.pf.toFixed(2));
      }
      document.getElementById('avgWin').value=d.avgWin!=null?d.avgWin.toFixed(2):'';
      const dd=document.getElementById('maxDD').value;
      const pfAuto=d.pf!=null?(d.pf>=999?'∞':d.pf.toFixed(2)):'—';
      const wrAuto=d.wr?d.wr.toFixed(1):'—';
      const rrAuto=d.rr!=null?d.rr.toFixed(2):'—';
      const wrNow=document.getElementById('winRate').value;
      const rrNow=document.getElementById('rr').value;
      const pfNow=document.getElementById('profitFactor').value;
      const wrTag=wrManual?` (手動 ${wrNow||'—'}%)`:'';
      const rrTag=rrManual?` (手動 ${rrNow||'—'})`:'';
      const pfTag=pfManual?` (手動 ${pfNow||'—'})`:'';
      document.getElementById('livePreview').textContent=
        `自動(風險$${d.risk}/筆) → 勝率 自動 ${wrAuto}%${wrTag} · RR 自動 ${rrAuto}${rrTag} · PF 自動 ${pfAuto}${pfTag} · 均盈 $${d.avgWin!=null?d.avgWin.toFixed(1):'—'} · 淨利 $${np||0} · 回撤 $${dd||0}`;
    }
    function computeWins(){
      const trades=Number(document.getElementById('trades').value)||0;
      const wrField=document.getElementById('winRate').value;
      if(!trades){alert('請先填交易數');return;}
      if(wrField===''){alert('請先填勝率（或讓它自動計算）');return;}
      const wr=Number(wrField);
      if(isNaN(wr)){alert('勝率格式錯誤');return;}
      const wins=Math.round(trades*wr/100);
      document.getElementById('wins').value=wins;
      recalc();
    }
    function buildObj() {
      const c = countYes();
      // 讀取目前欄位值
      const npField=document.getElementById('netProfit').value;
      const tradesField=document.getElementById('trades').value;
      const winsField=document.getElementById('wins').value;
      const riskField=document.getElementById('riskPerTrade').value || 100;
      const wrField=document.getElementById('winRate').value;
      const rrField=document.getElementById('rr').value;
      const pfField=document.getElementById('profitFactor').value;
      const d=calcFromFixedRisk(npField, tradesField, winsField, riskField);
      // 採用手動值優先
      const wrFinal=wrManual && wrField!=='' ? Number(wrField) : (d.wr||0);
      const rrFinal=rrManual && rrField!=='' ? Number(rrField) : (d.rr!=null?d.rr:0);
      const pfFinal=pfManual && pfField!=='' ? Number(pfField) : (d.pf!=null?(d.pf>=999?999:d.pf):0);
      return {
        type: 'backtest',
        date: id('date'), symbol: id('symbol'), timeframe: id('timeframe'),
        rangeStart: id('rangeStart'), rangeEnd: id('rangeEnd'),
        scriptName: id('scriptName'),
        leftEnv: id('leftEnv'), rightEnv: id('rightEnv'),
        active: val('active'), passive: val('passive'),
        engineering: val('engineering'), preset: val('preset'),
        abcd: c >= 4 ? '2+2' : c === 3 ? '2+1' : c >= 1 ? '1+1' : '—',
        grade: val('grade'),
        netProfit: npField===''?'—':Number(npField),
        maxDD: id('maxDD'),
        winRate: wrFinal,
        profitFactor: pfFinal,
        trades: tradesField===''?'—':Number(tradesField),
        wins: winsField===''?'—':Number(winsField),
        riskPerTrade: Number(riskField),
        avgWin: d.avgWin!=null?d.avgWin:0,
        avgLoss: d.avgLoss,
        slPoints: id('slPoints'), rr: rrFinal,
        wrManual: wrManual && wrField!=='',
        pfManual: pfManual && pfField!=='',
        rrManual: rrManual && rrField!=='',
        linkResult: link('linkResult'), linkChart: link('linkChart'), linkExtra: link('linkExtra'),
        llm: val('llm'), llmRemark: id('llmRemark'), notes: id('notes')
      };
    }
    function fmt(v, suffix=''){
      if(v==null||v===''||(typeof v==='number' && isNaN(v))) return '—';
      if(typeof v==='number') return v.toFixed(2)+suffix;
      return v+suffix;
    }
    function generateReport() {
      const o = buildObj();
      document.getElementById('report').textContent = `【A 皮盤房 Backtest 報告】
日期：${o.date}
品種：${o.symbol}｜週期：${o.timeframe}
區間：${o.rangeStart} → ${o.rangeEnd}
腳本：${o.scriptName}

環境（策略邏輯）
- 左側：${o.leftEnv}
- 右側：${o.rightEnv}
- 主動：${o.active}｜被動：${o.passive}｜工程：${o.engineering}｜預設：${o.preset}
- ABCD：${o.abcd}｜等級：${o.grade}

結果（固定風險 $${o.riskPerTrade}/筆）
- 淨利潤：$${typeof o.netProfit==='number'?o.netProfit.toFixed(2):o.netProfit}
- 最大回撤：$${o.maxDD}
- 交易：${o.trades}｜盈利：${o.wins}
- 勝率：${o.wrManual?'(手動) ':''}${fmt(o.winRate,'%')}
- RR：${o.rrManual?'(手動) ':''}${fmt(o.rr)}
- 盈利因子：${o.pfManual?'(手動) ':''}${fmt(o.profitFactor)}
- 推算均盈：$${fmt(o.avgWin)}
- 止損點數：${o.slPoints}

TradingView
- 結果圖：${o.linkResult}
- 圖表：${o.linkChart}
- 額外：${o.linkExtra}

LLM：${o.llm}
Remark：${o.llmRemark}
備註：${o.notes}`;
    }
    function copyReport() {
      navigator.clipboard.writeText(document.getElementById('report').textContent).then(() => alert('已複製'));
    }
    function copyJSON() {
      const o = buildObj();
      ['netProfit','maxDD','winRate','profitFactor','trades','wins','slPoints','rr','riskPerTrade','avgWin','avgLoss'].forEach(k => {
        if (typeof o[k] === 'string' && o[k] === '—') o[k] = 0;
        else if (typeof o[k] === 'string') o[k] = Number(o[k]) || 0;
      });
      ['linkResult','linkChart','linkExtra','llmRemark','notes','scriptName'].forEach(k => {
        if (o[k] === '—') o[k] = '';
      });
      navigator.clipboard.writeText(JSON.stringify(o, null, 2)).then(() => alert('JSON 已複製'));
    }
    function resetForm() {
      if (!confirm('清空？')) return;
      document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      document.querySelectorAll('input[type="number"], input[type="text"], input[type="url"], input[type="date"], textarea').forEach(el => el.value = '');
      document.getElementById('date').valueAsDate = new Date();
      document.getElementById('riskPerTrade').value = '100';
      ['symbol','timeframe','leftEnv','rightEnv'].forEach(i => document.getElementById(i).selectedIndex = 0);
      wrManual=false; pfManual=false; rrManual=false;
      document.getElementById('report').textContent = '填寫後點「產生報告」';
      recalc();
    }
    // 初始化
    recalc();
  </script>
</body>
</html>
