<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex 每日報告產生器</title>
  <style>
    :root {
      --bg: #0f1115; --card: #1a1d24; --border: #2a2f3a; --text: #e6e8ec;
      --muted: #9aa3b2; --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      padding: 20px; max-width: 900px; margin: 0 auto;
    }
    h1 { font-size: 1.45rem; margin-bottom: 6px; }
    .sub { color: var(--muted); margin-bottom: 20px; font-size: 0.88rem; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 16px 18px; margin-bottom: 14px;
    }
    .card h2 {
      font-size: 1rem; margin-bottom: 12px; color: var(--accent);
      border-bottom: 1px solid var(--border); padding-bottom: 6px;
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
    .row label.title { min-width: 160px; font-size: 0.88rem; color: var(--muted); }
    .options { display: flex; flex-wrap: wrap; gap: 6px; }
    .options label {
      display: flex; align-items: center; gap: 4px; background: #252a33;
      padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 0.86rem;
      border: 1px solid transparent;
    }
    .options label:hover { border-color: var(--accent); }
    .options input { accent-color: var(--accent); }
    input[type="text"], input[type="number"], input[type="date"], textarea, select {
      background: #252a33; border: 1px solid var(--border); color: var(--text);
      padding: 7px 10px; border-radius: 8px; font-size: 0.88rem; width: 100%; max-width: 260px;
    }
    textarea { max-width: 100%; min-height: 64px; resize: vertical; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    @media (max-width: 640px) {
      .grid2, .grid3 { grid-template-columns: 1fr; }
      .row label.title { min-width: 100%; }
    }
    .btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 8px; }
    button {
      background: var(--accent); color: white; border: none; padding: 9px 16px;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 600;
    }
    button.secondary { background: #334155; }
    button:hover { opacity: 0.9; }
    #report {
      background: #111827; border: 1px solid var(--border); border-radius: 12px;
      padding: 14px; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.82rem; line-height: 1.5; min-height: 100px; margin-top: 6px;
    }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Apex 每日報告產生器</h1>
  <p class="sub">左右環境 = 策略｜主動/被動/工程/預設｜A/B/C｜LLM｜一次填寫</p>

  <div class="card">
    <h2>基本資訊</h2>
    <div class="grid2">
      <div class="row"><label class="title">日期</label><input type="date" id="date" /></div>
      <div class="row">
        <label class="title">品種</label>
        <select id="symbol">
          <option>MNQ</option><option>MES</option><option>MYM</option><option>M2K</option>
          <option>MGC</option><option>SIL</option><option>MCL</option>
          <option>MBT</option><option>MET</option><option>M6E</option><option>M6A</option>
          <option>6J</option><option>其他</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>1. 開盤前準備</h2>
    <div class="row"><label class="title">檢查高影響新聞</label><div class="options"><label><input type="radio" name="news" value="Yes"> Yes</label><label><input type="radio" name="news" value="No"> No</label></div></div>
    <div class="row"><label class="title">HTF Bias 已確定</label><div class="options"><label><input type="radio" name="bias" value="Yes"> Yes</label><label><input type="radio" name="bias" value="No"> No</label></div></div>
    <div class="row"><label class="title">Killzone 時間確認</label><div class="options"><label><input type="radio" name="kz" value="Yes"> Yes</label><label><input type="radio" name="kz" value="No"> No</label></div></div>
  </div>

  <div class="card">
    <h2>2. 風險規則</h2>
    <div class="row"><label class="title">最多 1~2 張限制</label><div class="options"><label><input type="radio" name="size" value="Yes"> Yes</label><label><input type="radio" name="size" value="No"> No</label></div></div>
    <div class="row"><label class="title">Daily SL $100 未觸及</label><div class="options"><label><input type="radio" name="dailysl" value="Yes"> Yes</label><label><input type="radio" name="dailysl" value="No"> No</label></div></div>
  </div>

  <div class="card">
    <h2>3. Setup（左右 = 策略）</h2>
    <p class="hint">左側交易範圍環境 + 右側蠟燭形成環境，即為當日策略，無需另填策略欄。</p>
    <div class="row">
      <label class="title">左側環境</label>
      <select id="leftEnv">
        <option value="">—</option>
        <option>普通(打牌逻辑)</option><option>AMD</option><option>SMT</option><option>跳水</option><option>MMXM</option><option>無</option>
      </select>
    </div>
    <div class="row">
      <label class="title">右側環境</label>
      <select id="rightEnv">
        <option value="">—</option>
        <option>三驱动</option><option>NDOG</option><option>SMT</option><option>NWOG</option><option>普通(打牌逻辑)</option><option>套杀</option><option>無</option>
      </select>
    </div>
    <div class="row"><label class="title">主動</label><div class="options"><label><input type="radio" name="active" value="Yes"> Yes</label><label><input type="radio" name="active" value="No"> No</label></div></div>
    <div class="row"><label class="title">被動</label><div class="options"><label><input type="radio" name="passive" value="Yes"> Yes</label><label><input type="radio" name="passive" value="No"> No</label></div></div>
    <div class="row"><label class="title">工程</label><div class="options"><label><input type="radio" name="engineering" value="Yes"> Yes</label><label><input type="radio" name="engineering" value="No"> No</label></div></div>
    <div class="row"><label class="title">預設</label><div class="options"><label><input type="radio" name="preset" value="Yes"> Yes</label><label><input type="radio" name="preset" value="No"> No</label></div></div>
    <div class="row"><label class="title">最終等級</label><div class="options"><label><input type="radio" name="grade" value="A"> A</label><label><input type="radio" name="grade" value="B"> B</label><label><input type="radio" name="grade" value="C"> C</label></div></div>
    <div class="row"><label class="title">LLM 判斷</label><div class="options"><label><input type="radio" name="llm" value="A"> A</label><label><input type="radio" name="llm" value="B"> B</label><label><input type="radio" name="llm" value="C"> C</label><label><input type="radio" name="llm" value="未使用"> 未使用</label></div></div>
    <div class="row"><label class="title">是否執行交易</label><div class="options"><label><input type="radio" name="traded" value="Yes"> Yes</label><label><input type="radio" name="traded" value="No"> No</label></div></div>
  </div>

  <div class="card">
    <h2>4. 績效數據</h2>
    <div class="grid2">
      <div class="row"><label class="title">當日 PnL ($)</label><input type="number" id="pnl" step="0.01" placeholder="0.00" /></div>
      <div class="row"><label class="title">當日交易數</label><input type="number" id="trades" min="0" placeholder="0" /></div>
      <div class="row"><label class="title">當日盈利數</label><input type="number" id="wins" min="0" placeholder="0" /></div>
      <div class="row"><label class="title">當日平均 RR</label><input type="number" id="rr" step="0.1" placeholder="0.0" /></div>
      <div class="row"><label class="title">累計勝率 (%)</label><input type="number" id="winrate" step="0.1" placeholder="0.0" /></div>
      <div class="row"><label class="title">合格日進度</label><input type="text" id="qualified" placeholder="例如 2/5" /></div>
    </div>
    <div class="row" style="margin-top:8px">
      <label class="title">是否達成合格日 (≥$250)</label>
      <div class="options"><label><input type="radio" name="qualifiedDay" value="Yes"> Yes</label><label><input type="radio" name="qualifiedDay" value="No"> No</label></div>
    </div>
  </div>

  <div class="card">
    <h2>5. 複盤</h2>
    <div class="row"><label class="title">是否違反規則</label><div class="options"><label><input type="radio" name="violate" value="Yes"> Yes</label><label><input type="radio" name="violate" value="No"> No</label></div></div>
    <div class="row"><label class="title">備註 / 改進點</label><textarea id="notes" placeholder="今天的觀察、情緒、改進..."></textarea></div>
  </div>

  <div class="btns">
    <button onclick="generateReport()">產生報告</button>
    <button class="secondary" onclick="copyReport()">複製報告</button>
    <button class="secondary" onclick="copyJSON()">複製 JSON（給儀表板）</button>
    <button class="secondary" onclick="resetForm()">清空</button>
  </div>

  <div class="card">
    <h2>產生的報告</h2>
    <div id="report">填寫上方選項後點「產生報告」</div>
  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();
    function val(name) {
      const el = document.querySelector(`input[name="${name}"]:checked`);
      return el ? el.value : '—';
    }
    function id(i) { return document.getElementById(i).value || '—'; }

    function countYes() {
      let n = 0;
      ['active','passive','engineering','preset'].forEach(k => { if (val(k) === 'Yes') n++; });
      return n;
    }

    function buildObj() {
      const c = countYes();
      const abcd = c >= 4 ? '2+2' : c === 3 ? '2+1' : c >= 1 ? '1+1' : '—';
      return {
        date: id('date'), symbol: id('symbol'),
        news: val('news'), bias: val('bias'), kz: val('kz'),
        size: val('size'), dailysl: val('dailysl'),
        leftEnv: id('leftEnv'), rightEnv: id('rightEnv'),
        active: val('active'), passive: val('passive'),
        engineering: val('engineering'), preset: val('preset'),
        abcd, grade: val('grade'), llm: val('llm'), traded: val('traded'),
        pnl: id('pnl'), trades: id('trades'), wins: id('wins'), rr: id('rr'),
        winrate: id('winrate'), qualified: id('qualified'),
        qualifiedDay: val('qualifiedDay'), violate: val('violate'), notes: id('notes')
      };
    }

    function generateReport() {
      const o = buildObj();
      document.getElementById('report').textContent = `【Apex 每日報告】
日期：${o.date}
品種：${o.symbol}

一、開盤前準備
- 高影響新聞檢查：${o.news}
- HTF Bias 已確定：${o.bias}
- Killzone 確認：${o.kz}

二、風險規則
- 最多1~2張限制：${o.size}
- Daily SL $100 未觸及：${o.dailysl}

三、Setup（左右 = 策略）
- 左側環境：${o.leftEnv}
- 右側環境：${o.rightEnv}
- 主動：${o.active}｜被動：${o.passive}｜工程：${o.engineering}｜預設：${o.preset}
- ABCD：${o.abcd}
- 最終等級：${o.grade}
- LLM 判斷：${o.llm}
- 是否執行交易：${o.traded}

四、績效數據
- 當日 PnL：$ ${o.pnl}
- 當日交易數：${o.trades} 筆
- 當日盈利數：${o.wins} 筆
- 當日平均 RR：${o.rr}
- 累計勝率：${o.winrate}%
- 合格日進度：${o.qualified}
- 是否達成合格日：${o.qualifiedDay}

五、複盤
- 是否違反規則：${o.violate}
- 備註：${o.notes}

---
同步確認：
[ ] 已更新 Notion
[ ] 已更新儀表板`;
    }

    function copyReport() {
      navigator.clipboard.writeText(document.getElementById('report').textContent).then(() => alert('報告已複製'));
    }
    function copyJSON() {
      const o = buildObj();
      o.pnl = Number(o.pnl) || 0;
      o.trades = Number(o.trades) || 0;
      o.wins = Number(o.wins) || 0;
      o.rr = o.rr === '—' ? '' : o.rr;
      navigator.clipboard.writeText(JSON.stringify(o, null, 2)).then(() => alert('JSON 已複製'));
    }
    function resetForm() {
      if (!confirm('確定清空？')) return;
      document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
      document.querySelectorAll('input[type="number"], input[type="text"], textarea').forEach(el => el.value = '');
      document.getElementById('date').valueAsDate = new Date();
      ['symbol','leftEnv','rightEnv'].forEach(i => document.getElementById(i).selectedIndex = 0);
      document.getElementById('report').textContent = '填寫上方選項後點「產生報告」';
    }
  </script>
</body>
</html>
