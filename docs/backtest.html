<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex Backtest 追蹤 v1.1</title>
  <style>
    :root {
      --bg:#0b0e13; --card:#151a22; --border:#2a3341; --text:#e8eaed;
      --muted:#8b95a8; --blue:#3b82f6; --green:#22c55e; --red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);padding:14px;max-width:1100px;margin:0 auto;line-height:1.45}
    h1{font-size:1.3rem}
    .ver{display:inline-block;background:#3b1f1f;color:#fca5a5;font-size:0.72rem;padding:2px 8px;border-radius:6px;margin-left:6px}
    .sub{color:var(--muted);font-size:0.82rem;margin:4px 0 14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin-bottom:12px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
    .stat .label{color:var(--muted);font-size:0.66rem}
    .stat .value{font-size:1.02rem;font-weight:700}
    .positive{color:var(--green)}.negative{color:var(--red)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
    .card h2{font-size:0.92rem;color:var(--blue);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:5px}
    label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:3px}
    input,select{width:100%;background:#1e2530;border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:8px;font-size:0.84rem;margin-bottom:8px}
    input[readonly]{opacity:0.95;border-color:#3b82f6}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
    .row6{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
    button{background:var(--blue);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.84rem;margin:3px 4px 3px 0}
    button.secondary{background:#334155}button.danger{background:var(--red)}
    table{width:100%;border-collapse:collapse;font-size:0.68rem}
    th,td{padding:6px 3px;border-bottom:1px solid var(--border);text-align:left}
    th{color:var(--muted)}
    .empty{color:var(--muted);text-align:center;padding:16px}
    a.chart{color:#93c5fd;text-decoration:none}
    .hint{font-size:0.78rem;color:var(--muted);margin-bottom:8px}
    .live{font-size:0.75rem;color:#86efac;margin-bottom:8px}
    .tag{display:inline-block;padding:1px 5px;border-radius:4px;background:#1e293b;font-size:0.68rem}
    .auto{color:#86efac}
    @media(max-width:900px){.row6{grid-template-columns:1fr 1fr 1fr}.row2,.row3,.row4{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Apex Backtest 追蹤 <span class="ver">Backtest</span></h1>
  <p class="sub">固定風險 <b>$100</b>/筆 → 自動 RR / PF · <a class="chart" href="./index.html">← 實盤</a></p>

  <div class="grid">
    <div class="stat"><div class="label">回測次數</div><div class="value" id="s-n">0</div></div>
    <div class="stat"><div class="label">淨利合計 $</div><div class="value" id="s-pnl">$0</div></div>
    <div class="stat"><div class="label">最大回撤 $</div><div class="value" id="s-dd">$0</div></div>
    <div class="stat"><div class="label">平均勝率 %</div><div class="value" id="s-wr">0%</div></div>
    <div class="stat"><div class="label">平均 RR</div><div class="value" id="s-rr">—</div></div>
    <div class="stat"><div class="label">平均盈利因子</div><div class="value" id="s-pf">0</div></div>
    <div class="stat"><div class="label">最佳淨利</div><div class="value" id="s-best">$0</div></div>
  </div>

  <div class="card">
    <h2>新增 / 匯入</h2>
    <p class="hint">預設每筆風險 <span class="auto">$100</span>。填「淨利 + 交易數 + 盈利數」即可自動算出 RR、PF、均盈。</p>
    <div class="row3">
      <div><label>日期</label><input type="date" id="date"/></div>
      <div><label>品種</label><select id="symbol"><option>MNQ</option><option>MES</option><option>其他</option></select></div>
      <div><label>週期</label><select id="timeframe"><option>5m</option><option>15m</option><option>1H</option><option>4H</option></select></div>
    </div>
    <div class="row2">
      <div><label>左側</label><select id="leftEnv"><option value="">—</option><option>普通(打牌逻辑)</option><option>AMD</option><option>SMT</option><option>跳水</option><option>MMXM</option></select></div>
      <div><label>右側</label><select id="rightEnv"><option value="">—</option><option>套杀</option><option>三驱动</option><option>NDOG</option><option>NWOG</option><option>SMT</option><option>普通(打牌逻辑)</option></select></div>
    </div>
    <div class="row4">
      <div><label>主動</label><select id="active"><option>Yes</option><option>No</option></select></div>
      <div><label>被動</label><select id="passive"><option>Yes</option><option>No</option></select></div>
      <div><label>工程</label><select id="engineering"><option>Yes</option><option>No</option></select></div>
      <div><label>預設</label><select id="preset"><option>Yes</option><option>No</option></select></div>
    </div>
    <div class="row4">
      <div><label>淨利 $</label><input type="number" id="netProfit" step="0.01" oninput="recalc()"/></div>
      <div><label>最大回撤 $</label><input type="number" id="maxDD" step="0.01" oninput="recalc()"/></div>
      <div><label>交易數</label><input type="number" id="trades" oninput="recalc()"/></div>
      <div><label>盈利數 <span class="auto" style="cursor:pointer;text-decoration:underline" onclick="computeWins()" title="從 交易數 × 勝率 自動填入">↻ 從勝率</span></label><input type="number" id="wins" oninput="recalc()"/></div>
    </div>
    <div class="row4">
      <div><label>單筆風險 $（預設100）</label><input type="number" id="riskPerTrade" step="1" value="100" oninput="recalc()"/></div>
      <div><label>勝率 % <span class="auto">（自動，可手動覆蓋）</span></label><input type="number" id="winRate" step="0.1" oninput="wrManual=this.value!==''"/></div>
      <div><label>RR（自動）</label><input type="number" id="rr" step="0.01" readonly/></div>
      <div><label>盈利因子 PF <span class="auto">（自動，可手動覆蓋）</span></label><input type="number" id="profitFactor" step="0.01" oninput="pfManual=this.value!==''"/></div>
    </div>
    <div class="row4">
      <div><label>推算均盈 $（自動）</label><input type="number" id="avgWin" step="0.01" readonly/></div>
      <div><label>均虧 $（=風險）</label><input type="number" id="avgLoss" step="0.01" readonly/></div>
      <div><label>LLM rank</label><select id="llm"><option>A</option><option>B</option><option>C</option><option>未使用</option></select></div>
      <div><label>結果圖連結</label><input type="url" id="linkResult"/></div>
    </div>
    <div class="row2">
      <div><label>腳本名</label><input type="text" id="scriptName"/></div>
      <div><label>LLM Remark</label><input type="text" id="llmRemark" placeholder="LLM 結論 / 優化建議"/></div>
    </div>
    <p class="live" id="livePreview">填淨利 / 交易數 / 盈利數 → 自動算 RR、PF</p>
    <p class="hint" id="editHint" style="display:none;color:#fca5a5">✎ 編輯模式：改完按「更新」覆蓋此筆，按「取消編輯」放棄</p>
    <button id="addBtn" onclick="addRecord()">新增</button>
    <button id="cancelBtn" class="secondary" style="display:none" onclick="cancelEdit()">取消編輯</button>
    <button class="secondary" onclick="importJSON()">貼上 JSON 匯入</button>
    <button class="secondary" onclick="exportData()">匯出</button>
    <button class="danger" onclick="clearData()">清空</button>
  </div>

  <div class="card">
    <h2>篩選</h2>
    <div class="row3">
      <div><label>左側</label>
        <select id="fLeft" onchange="render()">
          <option value="">全部</option>
          <option>普通(打牌逻辑)</option><option>AMD</option><option>SMT</option><option>跳水</option><option>MMXM</option>
        </select>
      </div>
      <div><label>右側</label>
        <select id="fRight" onchange="render()">
          <option value="">全部</option>
          <option>套杀</option><option>三驱动</option><option>NDOG</option><option>NWOG</option><option>SMT</option><option>普通(打牌逻辑)</option>
        </select>
      </div>
      <div><label>LLM rank</label><select id="fLlm" onchange="render()"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>未使用</option></select></div>
    </div>
    <div class="row3">
      <div><label>主動</label><select id="fActive" onchange="render()"><option value="">全部</option><option>Yes</option><option>No</option></select></div>
      <div><label>被動</label><select id="fPassive" onchange="render()"><option value="">全部</option><option>Yes</option><option>No</option></select></div>
      <div><label>ABCD</label><select id="fAbcd" onchange="render()"><option value="">全部</option><option>2+2</option><option>2+1</option><option>1+1</option></select></div>
    </div>
  </div>

  <div class="card">
    <h2>回測紀錄</h2>
    <table>
      <thead>
        <tr>
          <th>日期</th><th>品種</th><th>左</th><th>右</th>
          <th>ABCD</th><th>LLM</th>
          <th>淨利</th><th>回撤</th><th>勝率</th><th>RR</th><th>PF</th>
          <th>Remark</th><th>圖</th><th></th>
        </tr>
      </thead>
      <tbody id="tbody"><tr><td colspan="14" class="empty">尚無紀錄</td></tr></tbody>
    </table>
  </div>

  <script>
    const KEY='apex_bt_v11e';
    const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}};
    const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
    let pfManual=false;
    let wrManual=false;
    let editingId=null;

    function abcdOf(r){
      if(r.abcd) return r.abcd;
      let n=0;
      if(r.active==='Yes')n++; if(r.passive==='Yes')n++;
      if(r.engineering==='Yes')n++; if(r.preset==='Yes')n++;
      return n>=4?'2+2':n===3?'2+1':n>=1?'1+1':'—';
    }

    function calcFromFixedRisk(netProfit, trades, wins, risk){
      const t=Number(trades)||0;
      const w=Number(wins)||0;
      const np=Number(netProfit);
      const r=Number(risk)>0?Number(risk):100;
      const losses=Math.max(0, t-w);
      const wr=t>0?(w/t*100):0;
      let avgWin=null, rr=null, pf=null;
      if(w>0 && !isNaN(np)){
        avgWin=(np + losses*r) / w;
        if(avgWin>0){
          rr=avgWin / r;
          pf=losses>0?(w*avgWin)/(losses*r):999;
        }
      } else if(w===0 && t>0 && !isNaN(np)){
        avgWin=0; rr=0; pf=0;
      }
      return {wr, avgWin, avgLoss:r, rr, pf, losses, risk:r};
    }

    function recalc(){
      const np=document.getElementById('netProfit').value;
      const trades=document.getElementById('trades').value;
      const wins=document.getElementById('wins').value;
      const risk=document.getElementById('riskPerTrade').value || 100;
      const d=calcFromFixedRisk(np, trades, wins, risk);
      // WR: respect user override; auto-fill only when empty
      if(!wrManual){
        document.getElementById('winRate').value=d.wr?d.wr.toFixed(1):'';
      }
      document.getElementById('avgLoss').value=d.avgLoss;
      document.getElementById('avgWin').value=d.avgWin!=null?d.avgWin.toFixed(2):'';
      document.getElementById('rr').value=d.rr!=null?d.rr.toFixed(2):'';
      // PF: respect user override; auto-fill only when empty
      if(!pfManual){
        document.getElementById('profitFactor').value=d.pf==null?'':(d.pf>=999?'999':d.pf.toFixed(2));
      }
      const dd=document.getElementById('maxDD').value;
      const pfAuto=d.pf!=null?(d.pf>=999?'∞':d.pf.toFixed(2)):'—';
      const pfNow=document.getElementById('profitFactor').value;
      const pfTag=pfManual?` (手動 ${pfNow||'—'})`:'';
      const wrAuto=d.wr?d.wr.toFixed(1):'—';
      const wrNow=document.getElementById('winRate').value;
      const wrTag=wrManual?` (手動 ${wrNow||'—'}%)`:'';
      document.getElementById('livePreview').textContent=
        `自動(風險$${d.risk}/筆) → 勝率 自動 ${wrAuto}%${wrTag} · RR ${d.rr!=null?d.rr.toFixed(2):'—'} · PF 自動 ${pfAuto}${pfTag} · 均盈 $${d.avgWin!=null?d.avgWin.toFixed(1):'—'} · 淨利 $${np||0} · 回撤 $${dd||0}`;
    }

    function computeWins(){
      const trades=Number(document.getElementById('trades').value)||0;
      const wrField=document.getElementById('winRate').value;
      if(!trades){alert('請先填交易數');return;}
      if(wrField===''){alert('請先填勝率（或讓它自動計算）');return;}
      const wr=Number(wrField);
      if(isNaN(wr)){alert('勝率格式錯誤');return;}
      const wins=Math.round(trades*wr/100);
      document.getElementById('wins').value=wins;
      recalc();
    }

    function loadRecord(id){
      const r=load().find(x=>x.id===id);
      if(!r){alert('找不到此紀錄');return;}
      // 回填表單
      const setVal=(i,v)=>{const el=document.getElementById(i); if(el) el.value=v==null?'':v;};
      setVal('date', r.date);
      setVal('symbol', r.symbol);
      setVal('timeframe', r.timeframe);
      setVal('leftEnv', r.leftEnv);
      setVal('rightEnv', r.rightEnv);
      setVal('active', r.active||'Yes');
      setVal('passive', r.passive||'Yes');
      setVal('engineering', r.engineering||'Yes');
      setVal('preset', r.preset||'Yes');
      setVal('netProfit', r.netProfit);
      setVal('maxDD', r.maxDD);
      setVal('trades', r.trades);
      setVal('wins', r.wins);
      setVal('riskPerTrade', r.riskPerTrade||100);
      setVal('winRate', r.winRate);
      setVal('rr', r.rr);
      setVal('profitFactor', r.profitFactor);
      setVal('avgWin', r.avgWin);
      setVal('avgLoss', r.avgLoss);
      setVal('llm', r.llm||'A');
      setVal('linkResult', r.linkResult);
      setVal('scriptName', r.scriptName);
      setVal('llmRemark', r.llmRemark);
      // 還原 manual 旗標
      wrManual = !!(r.wrManual && r.winRate!=null && r.winRate!=='');
      pfManual = !!(r.pfManual && r.profitFactor!=null && r.profitFactor!=='');
      // 進入編輯模式
      editingId = id;
      document.getElementById('addBtn').textContent = '更新';
      document.getElementById('cancelBtn').style.display = '';
      document.getElementById('editHint').style.display = '';
      // 滾動到表單
      window.scrollTo({top:0, behavior:'smooth'});
      recalc();
    }

    function cancelEdit(){
      editingId = null;
      wrManual = false; pfManual = false;
      document.getElementById('addBtn').textContent = '新增';
      document.getElementById('cancelBtn').style.display = 'none';
      document.getElementById('editHint').style.display = 'none';
      // 清空表單
      ['netProfit','maxDD','trades','wins','winRate','rr','profitFactor','avgWin','avgLoss','linkResult','scriptName','llmRemark'].forEach(i=>document.getElementById(i).value='');
      document.getElementById('riskPerTrade').value='100';
      document.getElementById('date').valueAsDate = new Date();
      recalc();
    }

    function filtered(){
      let d=load();
      const fLeft=document.getElementById('fLeft').value;
      const fRight=document.getElementById('fRight').value;
      const fl=document.getElementById('fLlm').value;
      const fa=document.getElementById('fActive').value;
      const fp=document.getElementById('fPassive').value;
      const fab=document.getElementById('fAbcd').value;
      if(fLeft) d=d.filter(r=>(r.leftEnv||'')===fLeft);
      if(fRight) d=d.filter(r=>(r.rightEnv||'')===fRight);
      if(fl) d=d.filter(r=>(r.llm||'')===fl);
      if(fa) d=d.filter(r=>(r.active||'')===fa);
      if(fp) d=d.filter(r=>(r.passive||'')===fp);
      if(fab) d=d.filter(r=>abcdOf(r)===fab);
      return d;
    }

    function render(){
      const all=load();
      const data=filtered().sort((a,b)=>b.date.localeCompare(a.date));

      // 統計用「目前篩選結果」
      const src=data;
      document.getElementById('s-n').textContent=src.length+(src.length!==all.length?` / ${all.length}`:'');
      const sumPnl=src.reduce((s,r)=>s+(Number(r.netProfit)||0),0);
      const maxDD=src.reduce((m,r)=>Math.max(m,Number(r.maxDD)||0),0);
      const avgWr=src.length?src.reduce((s,r)=>s+(Number(r.winRate)||0),0)/src.length:0;
      const rrList=src.map(r=>Number(r.rr)).filter(x=>!isNaN(x)&&x>0);
      const avgRr=rrList.length?rrList.reduce((a,b)=>a+b,0)/rrList.length:null;
      const pfList=src.map(r=>Number(r.profitFactor)).filter(x=>!isNaN(x)&&x>0&&x<999);
      const avgPf=pfList.length?pfList.reduce((a,b)=>a+b,0)/pfList.length:0;
      const best=src.reduce((m,r)=>Math.max(m,Number(r.netProfit)||-Infinity),src.length?0:0);

      const pnlEl=document.getElementById('s-pnl');
      pnlEl.textContent=(sumPnl>=0?'+':'')+'$'+sumPnl.toFixed(1);
      pnlEl.className='value '+(sumPnl>=0?'positive':'negative');
      document.getElementById('s-dd').textContent='$'+maxDD.toFixed(1);
      document.getElementById('s-wr').textContent=avgWr.toFixed(1)+'%';
      document.getElementById('s-rr').textContent=avgRr!=null?avgRr.toFixed(2):'—';
      document.getElementById('s-pf').textContent=avgPf.toFixed(2);
      const bestEl=document.getElementById('s-best');
      bestEl.textContent=(best>=0?'+':'')+'$'+(isFinite(best)?best.toFixed(1):'0');
      bestEl.className='value '+(best>=0?'positive':'negative');

      const tb=document.getElementById('tbody');
      if(!data.length){tb.innerHTML='<tr><td colspan="14" class="empty">尚無紀錄</td></tr>';return;}
      tb.innerHTML=data.map(r=>`<tr style="${r.id===editingId?'background:#3b1f1f':''}">
        <td>${r.date}</td>
        <td>${r.symbol}</td>
        <td>${r.leftEnv||'-'}</td>
        <td>${r.rightEnv||'-'}</td>
        <td><span class="tag">${abcdOf(r)}</span></td>
        <td>${r.llm||'-'}</td>
        <td class="${Number(r.netProfit)>=0?'positive':'negative'}">${Number(r.netProfit).toFixed(1)}</td>
        <td>${Number(r.maxDD||0).toFixed(1)}</td>
        <td>${r.winRate!=null?Number(r.winRate).toFixed(1):'-'}%</td>
        <td>${r.rr!=null&&r.rr!==''?Number(r.rr).toFixed(2):'-'}</td>
        <td>${r.profitFactor!=null?Number(r.profitFactor).toFixed(2):'-'}</td>
        <td title="${(r.llmRemark||'').replace(/"/g,'')}">${(r.llmRemark||'-').slice(0,18)}${(r.llmRemark||'').length>18?'…':''}</td>
        <td>${r.linkResult?`<a class="chart" href="${r.linkResult}" target="_blank">開</a>`:'-'}</td>
        <td>
          <button style="padding:2px 6px;font-size:0.7rem" onclick="loadRecord('${r.id}')" title="編輯">改</button>
          <button class="danger" style="padding:2px 6px;font-size:0.7rem" onclick="removeRecord('${r.id}')" title="刪除">刪</button>
        </td>
      </tr>`).join('');
    }

    function addRecord(){
      const date=document.getElementById('date').value;
      const np=document.getElementById('netProfit').value;
      if(!date||np===''){alert('請填日期與淨利');return;}
      recalc();
      const trades=Number(document.getElementById('trades').value)||0;
      const wins=Number(document.getElementById('wins').value)||0;
      const risk=Number(document.getElementById('riskPerTrade').value)||100;
      const d0=calcFromFixedRisk(np, trades, wins, risk);
      const active=document.getElementById('active').value;
      const passive=document.getElementById('passive').value;
      const engineering=document.getElementById('engineering').value;
      const preset=document.getElementById('preset').value;
      let n=0; [active,passive,engineering,preset].forEach(v=>{if(v==='Yes')n++});
      const abcd=n>=4?'2+2':n===3?'2+1':n>=1?'1+1':'—';
      // PF: use manual override if set, else auto
      const pfField=document.getElementById('profitFactor').value;
      const pfSaved=pfManual && pfField!==''
        ? Number(pfField)
        : (d0.pf!=null?(d0.pf>=999?999:d0.pf):0);
      // WR: use manual override if set, else auto from wins/trades
      const wrField=document.getElementById('winRate').value;
      const wrSaved=wrManual && wrField!=='' ? Number(wrField) : (d0.wr||0);
      const record={
        id: editingId || Date.now().toString(), date,
        symbol:document.getElementById('symbol').value,
        timeframe:document.getElementById('timeframe').value,
        leftEnv:document.getElementById('leftEnv').value,
        rightEnv:document.getElementById('rightEnv').value,
        active, passive, engineering, preset, abcd,
        netProfit:Number(np),
        maxDD:Number(document.getElementById('maxDD').value)||0,
        trades, wins,
        riskPerTrade:risk,
        avgWin:d0.avgWin, avgLoss:d0.avgLoss,
        winRate:wrSaved,
        rr:d0.rr,
        profitFactor:pfSaved,
        pfManual:pfManual && pfField!=='',
        wrManual:wrManual && wrField!=='',
        llm:document.getElementById('llm').value,
        llmRemark:document.getElementById('llmRemark').value.trim(),
        linkResult:document.getElementById('linkResult').value.trim(),
        scriptName:document.getElementById('scriptName').value
      };
      const data=load();
      if(editingId){
        const idx=data.findIndex(x=>x.id===editingId);
        if(idx>=0) data[idx]=record; else data.push(record);
      } else {
        data.push(record);
      }
      save(data); render();
      const wasEditing=!!editingId;
      editingId=null;
      ['netProfit','maxDD','trades','wins','winRate','rr','profitFactor','avgWin','avgLoss','linkResult','scriptName','llmRemark'].forEach(i=>document.getElementById(i).value='');
      document.getElementById('riskPerTrade').value='100';
      document.getElementById('date').valueAsDate=new Date();
      pfManual=false;
      wrManual=false;
      document.getElementById('addBtn').textContent='新增';
      document.getElementById('cancelBtn').style.display='none';
      document.getElementById('editHint').style.display='none';
      document.getElementById('livePreview').textContent=wasEditing?'已更新 ✓':'已新增 ✓';
      setTimeout(()=>{document.getElementById('livePreview').textContent='填淨利 / 交易數 / 盈利數 → 自動算 RR、PF';}, 1500);
    }

    function removeRecord(id){
      if(!confirm('刪？'))return;
      const data=load().filter(r=>r.id!==id);
      save(data);
      // 若刪除的是當前編輯的紀錄 → 退出編輯模式
      if(id===editingId){
        cancelEdit();
      }
      render();
    }

    function importJSON(){
      const t=prompt('貼上 Backtest 報告 JSON'); if(!t)return;
      try{
        const o=JSON.parse(t);
        const trades=Number(o.trades)||0, wins=Number(o.wins)||0;
        const risk=Number(o.riskPerTrade)||100;
        const np=Number(o.netProfit)||0;
        const d0=calcFromFixedRisk(np, trades, wins, risk);
        const active=o.active||'No', passive=o.passive||'No', engineering=o.engineering||'No', preset=o.preset||'No';
        let n=0; [active,passive,engineering,preset].forEach(v=>{if(v==='Yes')n++});
        const abcd=o.abcd||(n>=4?'2+2':n===3?'2+1':n>=1?'1+1':'—');
        const d=load();
        d.push({
          id:Date.now().toString(),
          date:o.date||new Date().toISOString().slice(0,10),
          symbol:o.symbol||'MNQ', timeframe:o.timeframe||'',
          leftEnv:o.leftEnv||'', rightEnv:o.rightEnv||'',
          active, passive, engineering, preset, abcd,
          netProfit:np, maxDD:Number(o.maxDD)||0,
          trades, wins, riskPerTrade:risk,
          avgWin:d0.avgWin, avgLoss:d0.avgLoss,
          winRate:d0.wr||0, rr:d0.rr,
          profitFactor:d0.pf!=null?(d0.pf>=999?999:d0.pf):0,
          llm:o.llm||'未使用', llmRemark:o.llmRemark||'',
          linkResult:o.linkResult||'', scriptName:o.scriptName||''
        });
        save(d); render(); alert('已匯入');
      }catch(e){alert('格式錯誤');}
    }

    function exportData(){
      const a=document.createElement('a');
      a.href=URL.createObjectURL(new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}));
      a.download='apex-backtests.json'; a.click();
    }
    function clearData(){if(confirm('清空？')){localStorage.removeItem(KEY);render();}}
    document.getElementById('date').valueAsDate=new Date();
    recalc();
    render();
  </script>
</body>
</html>
