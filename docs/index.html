<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex 50K 績效儀表板</title>
  <style>
    :root {
      --bg: #0b0e13;
      --card: #151a22;
      --border: #2a3341;
      --text: #e8eaed;
      --muted: #8b95a8;
      --blue: #3b82f6;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 1000px;
      margin: 0 auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 4px; }
    .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }
    .stat .label { color: var(--muted); font-size: 0.72rem; margin-bottom: 4px; }
    .stat .value { font-size: 1.15rem; font-weight: 700; }
    .positive { color: var(--green); }
    .negative { color: var(--red); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 0.98rem;
      color: var(--blue);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    input, select {
      width: 100%;
      background: #1e2530;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      margin-bottom: 10px;
    }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    button {
      background: var(--blue);
      color: white;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
      margin-right: 6px;
      margin-top: 4px;
    }
    button.secondary { background: #334155; }
    button.danger { background: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    th, td { padding: 7px 5px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; }
    .empty { color: var(--muted); text-align: center; padding: 18px; }
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      align-items: end;
    }
    .filter-bar > div { flex: 1; min-width: 120px; }
    .tag {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 0.72rem;
      background: #1e293b;
    }
    @media (max-width: 600px) {
      .row2, .row3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>Apex 50K 績效儀表板</h1>
  <p class="sub">多品種 · 多策略 · 自動計算 · 可篩選分析</p>

  <div class="grid">
    <div class="stat"><div class="label">累計 PnL</div><div class="value" id="s-pnl">$0</div></div>
    <div class="stat"><div class="label">總交易</div><div class="value" id="s-trades">0</div></div>
    <div class="stat"><div class="label">勝率</div><div class="value" id="s-wr">0%</div></div>
    <div class="stat"><div class="label">合格日</div><div class="value" id="s-qd">0 / 5</div></div>
  </div>

  <div class="card">
    <h2>新增紀錄</h2>
    <div class="row3">
      <div>
        <label>日期</label>
        <input type="date" id="date" />
      </div>
      <div>
        <label>品種</label>
        <select id="symbol">
          <option value="MNQ">MNQ (納指微)</option>
          <option value="MES">MES (標普微)</option>
          <option value="MYM">MYM (道指微)</option>
          <option value="M2K">M2K (羅素微)</option>
          <option value="MGC">MGC (黃金微)</option>
          <option value="SIL">SIL (白銀微)</option>
          <option value="MCL">MCL (原油微)</option>
          <option value="MBT">MBT (比特幣微)</option>
          <option value="MET">MET (以太坊微)</option>
          <option value="M6E">M6E (歐元微)</option>
          <option value="M6A">M6A (澳元微)</option>
          <option value="6J">6J (日圓)</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div>
        <label>策略</label>
        <select id="strategy">
          <option value="套杀">套杀</option>
          <option value="左右環境">左右環境</option>
          <option value="AMD">AMD</option>
          <option value="突破">突破</option>
          <option value="SMT">SMT</option>
          <option value="NDOG/NWOG">NDOG/NWOG</option>
          <option value="三驱动">三驱动</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="row3">
      <div>
        <label>當日 PnL ($)</label>
        <input type="number" id="pnl" step="0.01" placeholder="0.00" />
      </div>
      <div>
        <label>交易數</label>
        <input type="number" id="trades" min="0" placeholder="0" />
      </div>
      <div>
        <label>盈利數</label>
        <input type="number" id="wins" min="0" placeholder="0" />
      </div>
    </div>
    <div class="row3">
      <div>
        <label>平均 RR</label>
        <input type="number" id="rr" step="0.1" placeholder="0.0" />
      </div>
      <div>
        <label>等級</label>
        <select id="grade">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="-">—</option>
        </select>
      </div>
      <div>
        <label>備註</label>
        <input type="text" id="note" placeholder="可選" />
      </div>
    </div>
    <div>
      <button onclick="addRecord()">新增紀錄</button>
      <button class="secondary" onclick="exportData()">匯出 JSON</button>
      <button class="secondary" onclick="exportMarkdown()">匯出 Markdown</button>
      <button class="danger" onclick="clearData()">清空</button>
    </div>
  </div>

  <div class="card">
    <h2>篩選分析</h2>
    <div class="filter-bar">
      <div>
        <label>篩選品種</label>
        <select id="filterSymbol" onchange="render()">
          <option value="">全部</option>
          <option value="MNQ">MNQ</option>
          <option value="MES">MES</option>
          <option value="MYM">MYM</option>
          <option value="M2K">M2K</option>
          <option value="MGC">MGC</option>
          <option value="SIL">SIL</option>
          <option value="MCL">MCL</option>
          <option value="MBT">MBT</option>
          <option value="MET">MET</option>
          <option value="M6E">M6E</option>
          <option value="M6A">M6A</option>
          <option value="6J">6J</option>
        </select>
      </div>
      <div>
        <label>篩選策略</label>
        <select id="filterStrategy" onchange="render()">
          <option value="">全部</option>
          <option value="套杀">套杀</option>
          <option value="左右環境">左右環境</option>
          <option value="AMD">AMD</option>
          <option value="突破">突破</option>
          <option value="SMT">SMT</option>
          <option value="NDOG/NWOG">NDOG/NWOG</option>
          <option value="三驱动">三驱动</option>
          <option value="其他">其他</option>
        </select>
      </div>
    </div>
    <div class="grid" style="margin-bottom:0">
      <div class="stat"><div class="label">篩選 PnL</div><div class="value" id="f-pnl">$0</div></div>
      <div class="stat"><div class="label">篩選交易</div><div class="value" id="f-trades">0</div></div>
      <div class="stat"><div class="label">篩選勝率</div><div class="value" id="f-wr">0%</div></div>
    </div>
  </div>

  <div class="card">
    <h2>歷史紀錄</h2>
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>品種</th>
          <th>策略</th>
          <th>PnL</th>
          <th>交易</th>
          <th>勝</th>
          <th>RR</th>
          <th>等級</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="9" class="empty">尚無紀錄</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const STORAGE_KEY = 'apex_performance_v2';

    function load() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
      catch { return []; }
    }
    function save(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function calc(data) {
      const totalPnl = data.reduce((s, r) => s + Number(r.pnl || 0), 0);
      const totalTrades = data.reduce((s, r) => s + Number(r.trades || 0), 0);
      const totalWins = data.reduce((s, r) => s + Number(r.wins || 0), 0);
      const winRate = totalTrades > 0 ? (totalWins / totalTrades * 100) : 0;
      const qualifiedDays = data.filter(r => Number(r.pnl) >= 250).length;
      return { totalPnl, totalTrades, totalWins, winRate, qualifiedDays };
    }

    function filtered() {
      const all = load();
      const fs = document.getElementById('filterSymbol').value;
      const fstr = document.getElementById('filterStrategy').value;
      return all.filter(r => {
        if (fs && r.symbol !== fs) return false;
        if (fstr && r.strategy !== fstr) return false;
        return true;
      });
    }

    function render() {
      const all = load();
      const data = filtered().sort((a, b) => b.date.localeCompare(a.date));
      const sAll = calc(all);
      const s = calc(data);

      const pnlEl = document.getElementById('s-pnl');
      pnlEl.textContent = (sAll.totalPnl >= 0 ? '+' : '') + '$' + sAll.totalPnl.toFixed(2);
      pnlEl.className = 'value ' + (sAll.totalPnl >= 0 ? 'positive' : 'negative');
      document.getElementById('s-trades').textContent = sAll.totalTrades;
      document.getElementById('s-wr').textContent = sAll.winRate.toFixed(1) + '%';
      document.getElementById('s-qd').textContent = sAll.qualifiedDays + ' / 5';

      const fp = document.getElementById('f-pnl');
      fp.textContent = (s.totalPnl >= 0 ? '+' : '') + '$' + s.totalPnl.toFixed(2);
      fp.className = 'value ' + (s.totalPnl >= 0 ? 'positive' : 'negative');
      document.getElementById('f-trades').textContent = s.totalTrades;
      document.getElementById('f-wr').textContent = s.winRate.toFixed(1) + '%';

      const tbody = document.getElementById('tbody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" class="empty">尚無紀錄</td></tr>';
        return;
      }
      tbody.innerHTML = data.map(r => `
        <tr>
          <td>${r.date}</td>
          <td><span class="tag">${r.symbol || '-'}</span></td>
          <td><span class="tag">${r.strategy || '-'}</span></td>
          <td class="${r.pnl >= 0 ? 'positive' : 'negative'}">${r.pnl >= 0 ? '+' : ''}${Number(r.pnl).toFixed(2)}</td>
          <td>${r.trades}</td>
          <td>${r.wins}</td>
          <td>${r.rr || '-'}</td>
          <td>${r.grade || '-'}</td>
          <td><button class="danger" style="padding:3px 7px;font-size:0.72rem" onclick="removeRecord('${r.id}')">刪</button></td>
        </tr>
      `).join('');
    }

    function addRecord() {
      const date = document.getElementById('date').value;
      const pnl = document.getElementById('pnl').value;
      const trades = document.getElementById('trades').value;
      const wins = document.getElementById('wins').value;
      if (!date || pnl === '' || trades === '' || wins === '') {
        alert('請填寫日期、PnL、交易數、盈利數');
        return;
      }
      const data = load();
      data.push({
        id: Date.now().toString(),
        date,
        symbol: document.getElementById('symbol').value,
        strategy: document.getElementById('strategy').value,
        pnl: Number(pnl),
        trades: Number(trades),
        wins: Number(wins),
        rr: document.getElementById('rr').value || '',
        grade: document.getElementById('grade').value,
        note: document.getElementById('note').value
      });
      save(data);
      render();
      document.getElementById('pnl').value = '';
      document.getElementById('trades').value = '';
      document.getElementById('wins').value = '';
      document.getElementById('rr').value = '';
      document.getElementById('note').value = '';
    }

    function removeRecord(id) {
      if (!confirm('確定刪除？')) return;
      save(load().filter(r => r.id !== id));
      render();
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(load(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'apex-performance.json';
      a.click();
    }

    function exportMarkdown() {
      const data = load().sort((a, b) => a.date.localeCompare(b.date));
      let totalPnl = 0, totalTrades = 0, totalWins = 0;
      let md = `# 每日績效記錄\n\n| 日期 | 品種 | 策略 | 當日PnL | 累計PnL | 交易數 | 盈利數 | 勝率 | RR | 等級 |\n|------|------|------|---------|---------|--------|--------|------|-----|------|\n`;
      data.forEach(r => {
        totalPnl += Number(r.pnl);
        totalTrades += Number(r.trades);
        totalWins += Number(r.wins);
        const wr = totalTrades > 0 ? (totalWins / totalTrades * 100).toFixed(1) + '%' : '0%';
        md += `| ${r.date} | ${r.symbol} | ${r.strategy} | ${r.pnl} | ${totalPnl.toFixed(2)} | ${r.trades} | ${r.wins} | ${wr} | ${r.rr || '-'} | ${r.grade} |\n`;
      });
      const blob = new Blob([md], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'daily-log.md';
      a.click();
    }

    function clearData() {
      if (!confirm('確定清空所有本地資料？')) return;
      localStorage.removeItem(STORAGE_KEY);
      render();
    }

    document.getElementById('date').valueAsDate = new Date();
    render();
  </script>
</body>
</html>
