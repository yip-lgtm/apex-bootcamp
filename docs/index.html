<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Apex Bootcamp v1.1</title>
  <style>
    :root {
      --bg:#0b0e13; --card:#151a22; --border:#2a3341; --text:#e8eaed;
      --muted:#8b95a8; --blue:#3b82f6; --green:#22c55e; --red:#ef4444;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);padding:14px;max-width:1100px;margin:0 auto;line-height:1.45}
    h1{font-size:1.35rem;margin-bottom:4px}
    .ver{display:inline-block;background:#1e3a5f;color:#93c5fd;font-size:0.75rem;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:middle}
    .sub{color:var(--muted);font-size:0.82rem;margin-bottom:14px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:12px}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
    .stat .label{color:var(--muted);font-size:0.7rem}
    .stat .value{font-size:1.1rem;font-weight:700}
    .positive{color:var(--green)}.negative{color:var(--red)}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
    .card h2{font-size:0.95rem;color:var(--blue);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:5px}
    label{display:block;font-size:0.75rem;color:var(--muted);margin-bottom:3px}
    input,select,textarea{width:100%;background:#1e2530;border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:8px;font-size:0.85rem;margin-bottom:8px}
    textarea{min-height:56px;resize:vertical}
    .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
    .row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
    button{background:var(--blue);color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:0.84rem;margin:3px 4px 3px 0}
    button.secondary{background:#334155}button.danger{background:var(--red)}
    table{width:100%;border-collapse:collapse;font-size:0.75rem}
    th,td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)}
    th{color:var(--muted);font-weight:500}
    .empty{color:var(--muted);text-align:center;padding:16px}
    .tag{display:inline-block;padding:1px 6px;border-radius:5px;font-size:0.7rem;background:#1e293b}
    .breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
    .bd-item{background:#1e2530;border-radius:8px;padding:8px 10px;font-size:0.78rem}
    .bd-item .k{color:var(--muted);margin-bottom:4px;font-weight:600}
    .hint{font-size:0.78rem;color:var(--muted);margin-bottom:8px}
    @media(max-width:700px){.row2,.row3,.row4{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>Apex Bootcamp <span class="ver">v1.1</span></h1>
  <p class="sub">≥3張圖日誌 · LLM Remark · 左右=策略 · 一次紀錄多維分析</p>

  <div class="grid">
    <div class="stat"><div class="label">總合 PnL</div><div class="value" id="s-pnl">$0</div></div>
    <div class="stat"><div class="label">總交易</div><div class="value" id="s-trades">0</div></div>
    <div class="stat"><div class="label">總勝率</div><div class="value" id="s-wr">0%</div></div>
    <div class="stat"><div class="label">合格日</div><div class="value" id="s-qd">0/5</div></div>
  </div>

  <div class="card">
    <h2>新增紀錄</h2>
    <p class="hint">左右環境=策略。圖表請另截 ≥3 張（D/H4/H1），此處記錄完成狀態與 LLM Remark。</p>
    <div class="row3">
      <div><label>日期</label><input type="date" id="date"/></div>
      <div><label>品種</label>
        <select id="symbol">
          <option>MNQ</option><option>MES</option><option>MYM</option><option>M2K</option>
          <option>MGC</option><option>SIL</option><option>MCL</option>
          <option>MBT</option><option>MET</option><option>M6E</option><option>M6A</option><option>6J</option><option>其他</option>
        </select>
      </div>
      <div><label>等級</label><select id="grade"><option>A</option><option>B</option><option>C</option><option>-</option></select></div>
    </div>
    <div class="row3">
      <div><label>左側環境</label>
        <select id="leftEnv"><option value="">—</option><option>普通(打牌逻辑)</option><option>AMD</option><option>SMT</option><option>跳水</option><option>MMXM</option><option>無</option></select>
      </div>
      <div><label>右側環境</label>
        <select id="rightEnv"><option value="">—</option><option>三驱动</option><option>NDOG</option><option>SMT</option><option>NWOG</option><option>普通(打牌逻辑)</option><option>套杀</option><option>無</option></select>
      </div>
      <div><label>LLM</label><select id="llm"><option>A</option><option>B</option><option>C</option><option>未使用</option></select></div>
    </div>
    <div class="row4">
      <div><label>主動</label><select id="active"><option>Yes</option><option>No</option></select></div>
      <div><label>被動</label><select id="passive"><option>Yes</option><option>No</option></select></div>
      <div><label>工程</label><select id="engineering"><option>Yes</option><option>No</option></select></div>
      <div><label>預設</label><select id="preset"><option>Yes</option><option>No</option></select></div>
    </div>
    <div class="row4">
      <div><label>PnL ($)</label><input type="number" id="pnl" step="0.01"/></div>
      <div><label>交易數</label><input type="number" id="trades" min="0"/></div>
      <div><label>盈利數</label><input type="number" id="wins" min="0"/></div>
      <div><label>RR</label><input type="number" id="rr" step="0.1"/></div>
    </div>
    <div class="row3">
      <div><label>HTF-D 圖</label><select id="chartHTF"><option>Yes</option><option>No</option></select></div>
      <div><label>H4 圖</label><select id="chartH4"><option>Yes</option><option>No</option></select></div>
      <div><label>H1 圖</label><select id="chartH1"><option>Yes</option><option>No</option><option>跳過</option></select></div>
    </div>
    <div class="row2">
      <div><label>≥3張已備妥</label><select id="chartsOk"><option>Yes</option><option>No</option></select></div>
      <div><label>LLM Remark</label><input type="text" id="llmRemark" placeholder="LLM 理由摘要"/></div>
    </div>
    <button onclick="addRecord()">新增</button>
    <button class="secondary" onclick="importJSON()">貼上 JSON 匯入</button>
    <button class="secondary" onclick="exportData()">匯出 JSON</button>
    <button class="secondary" onclick="exportMarkdown()">匯出 MD</button>
    <button class="danger" onclick="clearData()">清空</button>
  </div>

  <div class="card">
    <h2>篩選檢視</h2>
    <div class="row3">
      <div><label>品種</label><select id="fSymbol" onchange="render()"><option value="">全部</option></select></div>
      <div><label>左側</label><select id="fLeft" onchange="render()"><option value="">全部</option></select></div>
      <div><label>右側</label><select id="fRight" onchange="render()"><option value="">全部</option></select></div>
    </div>
    <div class="row3">
      <div><label>等級</label><select id="fGrade" onchange="render()"><option value="">全部</option><option>A</option><option>B</option><option>C</option></select></div>
      <div><label>LLM</label><select id="fLlm" onchange="render()"><option value="">全部</option><option>A</option><option>B</option><option>C</option><option>未使用</option></select></div>
      <div><label>ABCD</label><select id="fAbcd" onchange="render()"><option value="">全部</option><option>2+2</option><option>2+1</option><option>1+1</option></select></div>
    </div>
    <div class="grid" style="margin-top:8px;margin-bottom:0">
      <div class="stat"><div class="label">篩選 PnL</div><div class="value" id="f-pnl">$0</div></div>
      <div class="stat"><div class="label">篩選交易</div><div class="value" id="f-trades">0</div></div>
      <div class="stat"><div class="label">篩選勝率</div><div class="value" id="f-wr">0%</div></div>
    </div>
  </div>

  <div class="card">
    <h2>各維度獨立分析</h2>
    <div class="breakdown" id="breakdown"></div>
  </div>

  <div class="card">
    <h2>歷史紀錄</h2>
    <table>
      <thead><tr><th>日期</th><th>品種</th><th>左</th><th>右</th><th>ABCD</th><th>等級</th><th>LLM</th><th>圖</th><th>PnL</th><th></th></tr></thead>
      <tbody id="tbody"><tr><td colspan="10" class="empty">尚無紀錄</td></tr></tbody>
    </table>
  </div>

  <script>
    const KEY='apex_perf_v11';
    const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return[]}};
    const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
    const calc=d=>({pnl:d.reduce((s,r)=>s+Number(r.pnl||0),0),trades:d.reduce((s,r)=>s+Number(r.trades||0),0),wins:d.reduce((s,r)=>s+Number(r.wins||0),0),wr:0,qd:d.filter(r=>Number(r.pnl)>=250).length});
    function withWr(c){c.wr=c.trades>0?(c.wins/c.trades*100):0;return c;}
    function abcdOf(r){
      if(r.abcd) return r.abcd;
      let n=0; if(r.active==='Yes')n++; if(r.passive==='Yes')n++; if(r.engineering==='Yes')n++; if(r.preset==='Yes')n++;
      return n>=4?'2+2':n===3?'2+1':n>=1?'1+1':'—';
    }
    function filtered(){
      let d=load(); const get=id=>document.getElementById(id).value;
      [['fSymbol','symbol'],['fLeft','leftEnv'],['fRight','rightEnv'],['fGrade','grade'],['fLlm','llm']].forEach(([fid,key])=>{const v=get(fid);if(v)d=d.filter(r=>(r[key]||'')===v)});
      const fa=get('fAbcd'); if(fa) d=d.filter(r=>abcdOf(r)===fa); return d;
    }
    function groupBy(data,keyFn){
      const m={}; data.forEach(r=>{const k=keyFn(r)||'—'; if(!m[k])m[k]=[]; m[k].push(r);});
      return Object.entries(m).map(([k,arr])=>({k,...withWr(calc(arr))})).sort((a,b)=>b.pnl-a.pnl);
    }
    function fillSelect(id,values){
      const el=document.getElementById(id); const cur=el.value; const first=el.options[0].outerHTML;
      el.innerHTML=first+[...new Set(values.filter(Boolean))].map(v=>`<option>${v}</option>`).join('');
      if([...el.options].some(o=>o.value===cur)) el.value=cur;
    }
    function render(){
      const all=load(); const data=filtered().sort((a,b)=>b.date.localeCompare(a.date));
      const sAll=withWr(calc(all)), s=withWr(calc(data));
      const setPnl=(id,val)=>{const el=document.getElementById(id); el.textContent=(val>=0?'+':'')+'$'+val.toFixed(2); el.className='value '+(val>=0?'positive':'negative');};
      setPnl('s-pnl',sAll.pnl); document.getElementById('s-trades').textContent=sAll.trades;
      document.getElementById('s-wr').textContent=sAll.wr.toFixed(1)+'%'; document.getElementById('s-qd').textContent=sAll.qd+'/5';
      setPnl('f-pnl',s.pnl); document.getElementById('f-trades').textContent=s.trades; document.getElementById('f-wr').textContent=s.wr.toFixed(1)+'%';
      fillSelect('fSymbol',all.map(r=>r.symbol)); fillSelect('fLeft',all.map(r=>r.leftEnv)); fillSelect('fRight',all.map(r=>r.rightEnv));
      const dims=[['品種',r=>r.symbol],['左側',r=>r.leftEnv],['右側',r=>r.rightEnv],['等級',r=>r.grade],['LLM',r=>r.llm],['ABCD',r=>abcdOf(r)],['≥3圖',r=>r.chartsOk]];
      document.getElementById('breakdown').innerHTML=dims.map(([title,fn])=>{
        const g=groupBy(all,fn); if(!g.length) return '';
        return `<div class="bd-item"><div class="k">${title}</div>`+g.map(x=>`<div>${x.k}: <b class="${x.pnl>=0?'positive':'negative'}">$${x.pnl.toFixed(1)}</b> · ${x.trades}筆 · ${x.wr.toFixed(0)}%</div>`).join('')+`</div>`;
      }).join('');
      const tb=document.getElementById('tbody');
      if(!data.length){tb.innerHTML='<tr><td colspan="10" class="empty">尚無紀錄</td></tr>';return;}
      tb.innerHTML=data.map(r=>`<tr>
        <td>${r.date}</td><td><span class="tag">${r.symbol||'-'}</span></td>
        <td>${r.leftEnv||'-'}</td><td>${r.rightEnv||'-'}</td><td>${abcdOf(r)}</td>
        <td>${r.grade||'-'}</td><td>${r.llm||'-'}</td>
        <td>${r.chartsOk||'-'}</td>
        <td class="${r.pnl>=0?'positive':'negative'}">${r.pnl>=0?'+':''}${Number(r.pnl).toFixed(1)}</td>
        <td><button class="danger" style="padding:2px 6px;font-size:0.7rem" onclick="removeRecord('${r.id}')">刪</button></td>
      </tr>`).join('');
    }
    function addRecord(){
      const date=document.getElementById('date').value, pnl=document.getElementById('pnl').value, trades=document.getElementById('trades').value, wins=document.getElementById('wins').value;
      if(!date||pnl===''||trades===''||wins===''){alert('請填日期/PnL/交易數/盈利數');return;}
      const active=document.getElementById('active').value, passive=document.getElementById('passive').value, engineering=document.getElementById('engineering').value, preset=document.getElementById('preset').value;
      let n=0; [active,passive,engineering,preset].forEach(v=>{if(v==='Yes')n++});
      const abcd=n>=4?'2+2':n===3?'2+1':n>=1?'1+1':'—';
      const d=load();
      d.push({
        id:Date.now().toString(), date,
        symbol:document.getElementById('symbol').value,
        leftEnv:document.getElementById('leftEnv').value, rightEnv:document.getElementById('rightEnv').value,
        active,passive,engineering,preset,abcd,
        grade:document.getElementById('grade').value, llm:document.getElementById('llm').value,
        llmRemark:document.getElementById('llmRemark').value,
        chartHTF:document.getElementById('chartHTF').value, chartH4:document.getElementById('chartH4').value, chartH1:document.getElementById('chartH1').value,
        chartsOk:document.getElementById('chartsOk').value,
        pnl:Number(pnl), trades:Number(trades), wins:Number(wins), rr:document.getElementById('rr').value||''
      });
      save(d); render();
      ['pnl','trades','wins','rr','llmRemark'].forEach(i=>document.getElementById(i).value='');
    }
    function removeRecord(id){if(!confirm('刪除？'))return;save(load().filter(r=>r.id!==id));render();}
    function importJSON(){
      const t=prompt('貼上報告 JSON'); if(!t)return;
      try{
        const o=JSON.parse(t); let n=0; ['active','passive','engineering','preset'].forEach(k=>{if(o[k]==='Yes')n++});
        const abcd=o.abcd||(n>=4?'2+2':n===3?'2+1':n>=1?'1+1':'—');
        const d=load();
        d.push({
          id:Date.now().toString(), date:o.date||new Date().toISOString().slice(0,10),
          symbol:o.symbol||'其他', leftEnv:o.leftEnv||'', rightEnv:o.rightEnv||'',
          active:o.active||'No', passive:o.passive||'No', engineering:o.engineering||'No', preset:o.preset||'No', abcd,
          grade:o.grade||'-', llm:o.llm||'未使用', llmRemark:o.llmRemark||'',
          chartHTF:o.chartHTF||'No', chartH4:o.chartH4||'No', chartH1:o.chartH1||'No', chartsOk:o.chartsOk||'No',
          pnl:Number(o.pnl)||0, trades:Number(o.trades)||0, wins:Number(o.wins)||0, rr:o.rr||''
        });
        save(d); render(); alert('已匯入');
      }catch(e){alert('JSON 格式錯誤');}
    }
    function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}));a.download='apex-v1.1-performance.json';a.click();}
    function exportMarkdown(){
      const data=load().sort((a,b)=>a.date.localeCompare(b.date));
      let md='# Apex Bootcamp v1.1\n\n| 日期 | 品種 | 左 | 右 | ABCD | 等級 | LLM | 圖 | PnL | Remark |\n|---|---|---|---|---|---|---|---|---|---|\n';
      data.forEach(r=>{md+=`| ${r.date} | ${r.symbol} | ${r.leftEnv||'-'} | ${r.rightEnv||'-'} | ${abcdOf(r)} | ${r.grade} | ${r.llm} | ${r.chartsOk||'-'} | ${r.pnl} | ${(r.llmRemark||'').replace(/\|/g,'/')} |\n`;});
      const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='daily-log-v1.1.md';a.click();
    }
    function clearData(){if(confirm('清空全部？')){localStorage.removeItem(KEY);render();}}
    document.getElementById('date').valueAsDate=new Date(); render();
  </script>
</body>
</html>
